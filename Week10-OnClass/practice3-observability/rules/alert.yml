groups:
  - name: flask-api-red
    rules:
      - alert: ApiP95High
        expr: |
          histogram_quantile(0.95,
            sum by(le)(rate(
              flask_http_request_duration_seconds_bucket[5m]
            ))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency > 1s"
          description: "p95 request latency vuot 1s trong 5 phut."